<style>
:root{--ink:#0B2540;--sea:#086F92;--sea-soft:#E3F3F8;--sand:#F6F1E7;--line:#D9D2C3;--viber:#5B49D6;--wa:#0E7A5F;--red:#B3261E;--sun:#F2A900}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:#fff}
a{color:inherit}
h1,h2,h3,p{margin:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ink);color:#fff}
.brand{font-weight:800;font-size:16px;letter-spacing:.02em;flex:1;line-height:1.2}
.brand small{display:block;font-weight:500;opacity:.8;font-size:13px}
.langs{display:flex;gap:4px}
.langs button{min-width:44px;height:40px;border:2px solid rgba(255,255,255,.45);background:none;color:#fff;border-radius:10px;font:700 15px/1 inherit;cursor:pointer}
.langs button[aria-pressed=true]{background:#fff;color:var(--ink);border-color:#fff}
.back{display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin-left:-6px;border-radius:12px;color:#fff;text-decoration:none;font-size:28px;font-weight:700}
.hero{position:relative;min-height:230px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(160deg,#0A7EA4,#0B2540)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(6,22,40,.85))}
.hero div{position:relative;z-index:1;padding:18px 16px}
.hero h1{font-size:30px;line-height:1.15;font-weight:800}
.hero p{font-size:16px;font-weight:600;opacity:.95}
.welcome{padding:16px;font-size:18px}
.warn{margin:12px 14px 0;padding:12px 14px;border-radius:12px;background:#FDECEA;color:var(--red);font-weight:700;font-size:15px;border:2px solid var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 14px 16px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:108px;padding:14px;border-radius:16px;background:var(--sand);border:2px solid var(--line);text-decoration:none;font-weight:800;font-size:17px;line-height:1.2}
.tile span{font-size:32px;line-height:1}
.tile:active{transform:scale(.98)}
.tile.sea{background:var(--sea);border-color:var(--sea);color:#fff}
.tile.money{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:84px;background:var(--viber);border-color:var(--viber);color:#fff}
.tile.money small{display:block;font-weight:600;font-size:14px;opacity:.92;margin-top:2px}
.tile.sos{background:#fff;border-color:var(--red);color:var(--red)}
.cta{margin:6px 14px 0;padding:20px 16px;border-radius:18px;background:var(--viber);color:#fff;text-align:center}
.cta h2{font-size:21px;line-height:1.25;margin-bottom:6px}
.cta p{font-size:16px;margin-bottom:14px;opacity:.95}
.foot{padding:22px 16px 30px;text-align:center;font-size:14px;color:#5a6676}
main{padding:16px 14px 28px}
main>h2{font-size:26px;line-height:1.2;margin-bottom:14px}
.card{padding:16px;border-radius:16px;border:2px solid var(--line);background:#fff;margin-bottom:12px}
.card.hl{border-color:var(--viber);background:#F3F1FE}
.card h3{font-size:20px;line-height:1.25;margin-bottom:4px}
.meta{font-size:15px;font-weight:700;color:var(--sea);margin-bottom:6px}
.card p{margin-bottom:10px}
.card p:last-child{margin-bottom:0}
.label{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5a6676}
.big{font-size:26px;font-weight:800;word-break:break-all;line-height:1.25;margin-bottom:10px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.times .card{margin:0;text-align:center}
.times b{display:block;font-size:34px;line-height:1.1}
ol,ul{margin:0;padding:0;list-style:none}
ol{counter-reset:n}
ol li{counter-increment:n;position:relative;padding:8px 0 8px 44px;border-top:1px solid var(--line)}
ol li:first-child{border-top:0}
ol li:before{content:counter(n);position:absolute;left:0;top:7px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center}
.rule{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-weight:600}
.rule:first-child{border-top:0;padding-top:0}
.rule span{font-size:28px;line-height:1.1}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:12px 16px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:800 18px/1.2 inherit;text-decoration:none;text-align:center;cursor:pointer}
.btn+.btn,.btn+.row,.row+.btn{margin-top:10px}
.btn:active{opacity:.85}
.btn.sea{background:var(--sea)}.btn.viber{background:var(--viber)}.btn.wa{background:var(--wa)}.btn.red{background:var(--red)}
.btn.white{background:#fff;color:var(--viber)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink);min-height:48px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row .btn{margin:0}
details.card{padding:0}
details summary{display:flex;align-items:center;gap:12px;padding:16px;font-weight:800;font-size:20px;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary span{font-size:30px}
details summary:after{content:"+";margin-left:auto;font-size:28px;font-weight:400}
details[open] summary:after{content:"–"}
details .in{padding:0 16px 16px}
details img{width:100%;border-radius:12px;margin-top:10px}
.tel{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);margin-bottom:10px;text-decoration:none;font-weight:700;line-height:1.3}
.tel b{margin-left:auto;font-size:24px;white-space:nowrap;color:var(--red)}
.tel.long{display:block}.tel.long b{display:block;margin-top:4px}
.tel.x{background:var(--red);border-color:var(--red);color:#fff}
.tel.x b{color:#fff;font-size:36px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);max-width:90%;padding:14px 18px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:16px;text-align:center;opacity:0;pointer-events:none;transition:.25s;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>

<script>
/* ───────── Текстове на интерфейса (не се сменят за всеки имот) ───────── */
const UI = {
  bg: { guide:'Пътеводител за гости', wifi:'Wi-Fi', checkin:'Настаняване и напускане', rules:'Правила на къщата', howto:'Как работят нещата',
        beaches:'Плажове наблизо', food:'Къде да хапнем', shops:'Магазини, аптека, банкомат', sights:'Какво да видим', services:'Платени услуги',
        servicesSub:'Късно напускане, трансфер, удължаване…', sos:'Спешни телефони', contact:'Контакт с нас',
        network:'Мрежа', password:'Парола', copyPass:'Копирай паролата', copied:'Копирано ✓',
        in:'Настаняване', out:'Напускане', from:'от', until:'до', key:'Къде е ключът', beforeLeave:'Преди да тръгнете',
        map:'Отвори в Google Maps', order:'Поръчай във Viber', orWa:'или през WhatsApp', askPrice:'Цена при запитване',
        msgCopied:'Съобщението е копирано. Ако не се появи във Viber – задръж в полето и избери „Постави“.',
        servicesIntro:'Натиснете бутона – Viber се отваря с готово съобщение. Отговаряме бързо.',
        call:'Обади се', viber:'Пиши във Viber', whatsapp:'Пиши в WhatsApp', contactIntro:'Въпрос или проблем? Пишете ни – най-бързо отговаряме във Viber.',
        host:'Вашият домакин', ctaTitle:'Абонирай се за Viber канала ни', ctaSub:'Оферти за следващото лято – първи научаваш за свободните дати и ранните цени.', ctaBtn:'Абонирай се безплатно',
        foot:'Приятна почивка!', todo:'Само за теб (гостите не трябва да виждат това): има непопълнени полета в CONFIG – потърси „ПОПЪЛНИ“. Брой: ' },
  en: { guide:'Guest guide', wifi:'Wi-Fi', checkin:'Check-in & check-out', rules:'House rules', howto:'How things work',
        beaches:'Beaches nearby', food:'Where to eat', shops:'Shops, pharmacy, ATM', sights:'What to see', services:'Extra services',
        servicesSub:'Late check-out, transfer, extra nights…', sos:'Emergency numbers', contact:'Contact us',
        network:'Network', password:'Password', copyPass:'Copy password', copied:'Copied ✓',
        in:'Check-in', out:'Check-out', from:'from', until:'by', key:'Where is the key', beforeLeave:'Before you leave',
        map:'Open in Google Maps', order:'Order on Viber', orWa:'or via WhatsApp', askPrice:'Price on request',
        msgCopied:'Message copied. If it does not appear in Viber, long-press the text field and tap "Paste".',
        servicesIntro:'Tap the button – Viber opens with a ready message. We reply fast.',
        call:'Call', viber:'Message on Viber', whatsapp:'Message on WhatsApp', contactIntro:'A question or a problem? Message us – Viber gets the fastest reply.',
        host:'Your host', ctaTitle:'Follow our Viber channel', ctaSub:'Offers for next summer – be the first to hear about free dates and early-bird prices.', ctaBtn:'Subscribe for free',
        foot:'Enjoy your holiday!', todo:'', },
  ro: { guide:'Ghidul oaspeților', wifi:'Wi-Fi', checkin:'Check-in și check-out', rules:'Regulile casei', howto:'Cum funcționează',
        beaches:'Plaje în apropiere', food:'Unde mâncăm', shops:'Magazine, farmacie, bancomat', sights:'Ce să vizitați', services:'Servicii extra',
        servicesSub:'Check-out târziu, transfer, nopți în plus…', sos:'Numere de urgență', contact:'Contact',
        network:'Rețea', password:'Parolă', copyPass:'Copiază parola', copied:'Copiat ✓',
        in:'Check-in', out:'Check-out', from:'de la', until:'până la', key:'Unde este cheia', beforeLeave:'Înainte de plecare',
        map:'Deschide în Google Maps', order:'Comandă pe Viber', orWa:'sau pe WhatsApp', askPrice:'Preț la cerere',
        msgCopied:'Mesajul a fost copiat. Dacă nu apare în Viber, țineți apăsat pe câmp și alegeți „Lipește”.',
        servicesIntro:'Apăsați butonul – Viber se deschide cu mesajul pregătit. Răspundem repede.',
        call:'Sună', viber:'Scrie pe Viber', whatsapp:'Scrie pe WhatsApp', contactIntro:'O întrebare sau o problemă? Scrieți-ne – pe Viber răspundem cel mai repede.',
        host:'Gazda dumneavoastră', ctaTitle:'Abonează-te la canalul nostru Viber', ctaSub:'Oferte pentru vara viitoare – afli primul despre datele libere și prețurile early booking.', ctaBtn:'Abonează-te gratuit',
        foot:'Vacanță plăcută!', todo:'' },
  sr: { guide:'Vodič za goste', wifi:'Wi-Fi', checkin:'Prijava i odjava', rules:'Kućni red', howto:'Kako šta radi',
        beaches:'Plaže u blizini', food:'Gde jesti', shops:'Prodavnice, apoteka, bankomat', sights:'Šta videti', services:'Dodatne usluge',
        servicesSub:'Kasna odjava, transfer, produžetak…', sos:'Hitni brojevi', contact:'Kontakt',
        network:'Mreža', password:'Lozinka', copyPass:'Kopiraj lozinku', copied:'Kopirano ✓',
        in:'Prijava', out:'Odjava', from:'od', until:'do', key:'Gde je ključ', beforeLeave:'Pre polaska',
        map:'Otvori u Google Maps', order:'Poruči preko Vibera', orWa:'ili preko WhatsApp-a', askPrice:'Cena na upit',
        msgCopied:'Poruka je kopirana. Ako se ne pojavi u Viberu, zadržite prst na polju i izaberite „Nalepi“.',
        servicesIntro:'Pritisnite dugme – Viber se otvara sa gotovom porukom. Odgovaramo brzo.',
        call:'Pozovi', viber:'Piši na Viber', whatsapp:'Piši na WhatsApp', contactIntro:'Pitanje ili problem? Pišite nam – na Viberu najbrže odgovaramo.',
        host:'Vaš domaćin', ctaTitle:'Zaprati naš Viber kanal', ctaSub:'Ponude za sledeće leto – prvi saznaj za slobodne termine i rane cene.', ctaBtn:'Prijavi se besplatno',
        foot:'Prijatan odmor!', todo:'' }
};

/* ───────── Помощни функции ───────── */
const C = CONFIG, LS = 'hsr-lang';
const langs = C.languages.filter(l => UI[l]);
let lang = (() => {
  let s = null; try { s = localStorage.getItem(LS); } catch (e) {}
  if (langs.includes(s)) return s;
  const n = (navigator.language || '').slice(0, 2).toLowerCase();
  return langs.includes(n) ? n : (langs.includes('en') ? 'en' : langs[0]);
})();
const L = k => (UI[lang] && UI[lang][k]) || UI.en[k] || '';
const t = v => v == null ? '' : typeof v === 'string' ? v : (v[lang] ?? v.en ?? v.bg ?? '');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const T = v => esc(t(v));
const digits = p => String(p).replace(/\D/g, '');
const mapUrl = q => /^https?:/.test(q) ? q : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const viberUrl = m => 'viber://chat?number=%2B' + digits(C.contact.viber) + (m ? '&draft=' + encodeURIComponent(m) : '');
const waUrl = m => 'https://wa.me/' + digits(C.contact.whatsapp) + (m ? '?text=' + encodeURIComponent(m) : '');
const mapBtn = q => q ? `<a class="btn sea" href="${esc(mapUrl(q))}" target="_blank" rel="noopener">📍 ${L('map')}</a>` : '';
const todoCount = (JSON.stringify(C).match(/ПОПЪЛНИ/g) || []).length;

/* ───────── Секции ───────── */
const S = {
  wifi: { icon: '📶', cls: 'sea', html: () => `
    <div class="card"><p class="label">${L('network')}</p><p class="big">${esc(C.wifi.network)}</p>
      <p class="label">${L('password')}</p><p class="big">${esc(C.wifi.password)}</p>
      <button class="btn sea" data-copy="${esc(C.wifi.password)}">📋 ${L('copyPass')}</button></div>` },

  checkin: { icon: '🔑', html: () => `
    <div class="times"><div class="card"><p class="label">${L('in')}</p><b>${esc(C.checkin.inTime)}</b>${L('from')} ${esc(C.checkin.inTime)}</div>
      <div class="card"><p class="label">${L('out')}</p><b>${esc(C.checkin.outTime)}</b>${L('until')} ${esc(C.checkin.outTime)}</div></div>
    <div class="card"><h3>🔑 ${L('key')}</h3><p>${T(C.checkin.key)}</p></div>
    <div class="card"><h3>🧳 ${L('beforeLeave')}</h3><ol>${C.checkin.checkoutSteps.map(s => `<li>${T(s)}</li>`).join('')}</ol></div>` },

  rules: { icon: '📋', html: () => `<div class="card">${C.rules.map(r => `<div class="rule"><span>${r.icon}</span><div>${T(r.text)}</div></div>`).join('')}</div>` },

  howto: { icon: '🛠️', html: () => C.howto.map((h, i) => `
    <details class="card"${i ? '' : ' open'}><summary><span>${h.icon}</span>${T(h.title)}</summary><div class="in">
      <ol>${h.steps.map(s => `<li>${T(s)}</li>`).join('')}</ol>
      ${h.photo ? `<img src="${esc(h.photo)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div></details>`).join('') },

  beaches: { icon: '🏖️', html: () => C.beaches.map(b => `
    <div class="card"><h3>${esc(b.name)}</h3><p class="meta">${esc(b.dist)} · ${T(b.tags)}</p><p>${T(b.desc)}</p>${mapBtn(b.map)}</div>`).join('') },

  food: { icon: '🍽️', html: () => C.food.map(f => `
    <div class="card"><h3>${esc(f.name)}</h3><p class="meta">${T(f.type)}</p><p>${T(f.order)}</p>${mapBtn(f.map)}</div>`).join('') },

  shops: { icon: '🛒', html: () => C.shops.map(s => `
    <div class="card"><h3>${s.icon} ${T(s.name)}</h3><p>${T(s.note)}</p>${mapBtn(s.map)}</div>`).join('') },

  sights: { icon: '🗺️', html: () => C.sights.map(s => `
    <div class="card"><h3>${T(s.name)}</h3><p class="meta">${esc(s.dist)}</p><p>${T(s.desc)}</p>${mapBtn(s.map)}</div>`).join('') },

  services: { icon: '⭐', html: () => `<p style="margin-bottom:14px">${L('servicesIntro')}</p>` + C.services.map(s => {
    const m = t(s.msg).replace('{property}', C.property.name);
    return `<div class="card${s.highlight ? ' hl' : ''}"><h3>${s.icon} ${T(s.title)}</h3>
      <p class="meta">${t(s.price) ? T(s.price) : L('askPrice')}</p><p>${T(s.desc)}</p>
      <a class="btn viber" href="${esc(viberUrl(m))}" data-msg="${esc(m)}">💬 ${L('order')}</a>
      <a class="btn ghost" href="${esc(waUrl(m))}" target="_blank" rel="noopener">${L('orWa')}</a></div>`; }).join('') },

  sos: { icon: '🆘', html: () => C.emergency.map(e => e.phone
    ? `<a class="tel${e.big ? ' x' : ''}${e.phone.length > 6 ? ' long' : ''}" href="tel:${esc(e.phone.replace(/\s/g, ''))}"><span>${T(e.name)}</span><b>${esc(e.phone.replace(/^\+30(\d{5})(\d+)/, '+30 $1 $2'))}</b></a>${e.map ? mapBtn(e.map) + '<div style="height:10px"></div>' : ''}`
    : `<div class="card"><h3>${T(e.name)}</h3>${mapBtn(e.map)}</div>`).join('') },

  contact: { icon: '💬', html: () => `
    <div class="card"><p class="label">${L('host')}</p><p class="big">${esc(C.contact.hostName)} · ${esc(C.brand)}</p><p>${L('contactIntro')}</p>
      <a class="btn viber" href="${esc(viberUrl(''))}">💬 ${L('viber')}</a>
      <a class="btn wa" href="${esc(waUrl(''))}" target="_blank" rel="noopener">🟢 ${L('whatsapp')}</a>
      <a class="btn" href="tel:${esc(C.contact.phone)}">📞 ${L('call')} ${esc(C.contact.phone)}</a></div>` }
};
const ORDER = ['wifi', 'checkin', 'rules', 'howto', 'beaches', 'food', 'shops', 'sights', 'services', 'sos', 'contact'];

/* ───────── Изгледи ───────── */
function langSwitch() {
  return langs.length < 2 ? '' : `<div class="langs">${langs.map(l => `<button data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('')}</div>`;
}
function cta() {
  const ok = /^(https?|viber):/.test(C.contact.viberChannel);
  return `<div class="cta"><h2>📣 ${L('ctaTitle')}</h2><p>${L('ctaSub')}</p>
    <a class="btn white" href="${ok ? esc(C.contact.viberChannel) : '#'}"${ok ? ' target="_blank" rel="noopener"' : ''}>${L('ctaBtn')}</a></div>`;
}
function home() {
  const tile = id => id === 'services'
    ? `<a class="tile money" href="#services"><span>⭐</span><div>${L('services')}<small>${L('servicesSub')}</small></div></a>`
    : `<a class="tile ${S[id].cls || ''} ${id === 'sos' ? 'sos' : ''}" href="#${id}"><span>${S[id].icon}</span>${L(id)}</a>`;
  return `<header class="top"><div class="brand">${esc(C.brand)}<small>${L('guide')}</small></div>${langSwitch()}</header>
    <div class="hero">${C.property.photo ? `<img src="${esc(C.property.photo)}" alt="" onerror="this.remove()">` : ''}
      <div><h1>${esc(C.property.name)}</h1><p>${T(C.property.area)}</p></div></div>
    ${todoCount ? `<div class="warn">⚠ ${UI.bg.todo}${todoCount}</div>` : ''}
    <p class="welcome">${T(C.property.welcome)}</p>
    <nav class="grid">${ORDER.map(tile).join('')}</nav>
    ${cta()}
    <p class="foot">${L('foot')} 🌊<br>${esc(C.brand)}</p>`;
}
function section(id) {
  return `<header class="top"><a class="back" href="#" aria-label="Back">‹</a><div class="brand">${esc(C.property.name)}<small>${esc(C.brand)}</small></div>${langSwitch()}</header>
    <main><h2>${S[id].icon} ${L(id)}</h2>${S[id].html()}</main>
    ${id === 'services' || id === 'contact' ? cta() + '<p class="foot"></p>' : ''}`;
}
function render(keepScroll) {
  const id = location.hash.slice(1);
  document.documentElement.lang = lang;
  document.title = C.property.name + ' – ' + C.brand;
  document.getElementById('app').innerHTML = S[id] ? section(id) : home();
  if (!keepScroll) scrollTo(0, 0);
}

/* ───────── Действия ───────── */
let toastTimer;
function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), ms || 2200);
}
function copy(text) {
  if (navigator.clipboard && isSecureContext) return navigator.clipboard.writeText(text).catch(() => legacyCopy(text));
  legacyCopy(text); return Promise.resolve();
}
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  ta.remove();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-lang],[data-copy],[data-msg]');
  if (!el) return;
  if (el.dataset.lang) { lang = el.dataset.lang; try { localStorage.setItem(LS, lang); } catch (x) {} render(true); }
  else if (el.dataset.copy != null) { copy(el.dataset.copy); toast(L('copied')); }
  else if (el.dataset.msg) { copy(el.dataset.msg); toast(L('msgCopied'), 6000); }   // линкът към Viber се отваря след това
});
addEventListener('hashchange', () => render());
render();
</script>
</body>
</html>
